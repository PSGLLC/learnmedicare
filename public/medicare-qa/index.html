      "name": "When should I sign up for Medicare?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Most people should sign up for Medicare when they turn 65. If you're receiving Social Security benefits, you'll be enrolled automatically. If not, you have a 7-month Initial Enrollment Period — 3 months before your birthday month, your birthday month, and 3 months after."
      }
    },
    {
      "@type": "Question",
      "name": "What is the difference between Medicare Advantage and Original Medicare?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Original Medicare (Parts A and B) is provided directly by the federal government and covers hospital and medical services. Medicare Advantage (Part C) is offered by private insurance companies approved by Medicare and typically bundles Parts A, B, and often D into one plan, often with additional benefits like dental, vision, and hearing."
      }
    },
    {
      "@type": "Question",
      "name": "What does Medicare Part D cover?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Medicare Part D covers prescription drugs. It's offered through private insurance companies approved by Medicare. You can get Part D as a standalone plan if you have Original Medicare, or it may be included in a Medicare Advantage plan."
      }
    },
    {
      "@type": "Question",
      "name": "What is a Medigap plan?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A Medigap plan (also called Medicare Supplement) is private insurance that helps pay costs not covered by Original Medicare, such as deductibles, copayments, and coinsurance. Medigap plans are standardized and labeled by letter (Plan G, Plan N, etc.)."
      }
    },
    {
      "@type": "Question",
      "name": "Will I have a penalty if I enroll in Medicare late?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes — if you don't sign up for Medicare Part B when you're first eligible and don't have other qualifying coverage, you may face a late enrollment penalty of 10% added to your premium for each 12-month period you were eligible but didn't enroll. This penalty lasts as long as you have Part B."
      }
    },
    {
      "@type": "Question",
      "name": "How much does Medicare cost per month in 2026?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "In 2026, the standard Medicare Part B premium is $185.00 per month. Part A is free for most people who worked and paid Medicare taxes for at least 10 years. Part D premiums vary by plan and location. Medicare Advantage premiums vary widely — some plans have $0 premiums."
      }
    }
